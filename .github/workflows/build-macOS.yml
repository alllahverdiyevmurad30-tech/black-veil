name: Build macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check project files
        run: |
          pwd
          ls -la
          test -f package.json || {
            echo "ERROR: package.json not found"
            exit 1
          }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build macOS app
        run: |
          if npm run | grep -q "build:mac"; then
            npm run build:mac
          elif npm run | grep -q "build"; then
            npm run build
          else
            echo "ERROR: No suitable build script found in package.json"
            exit 1
          fi

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: BLACK-VEIL-macOS
          path: |
            dist/**
            release/**
            build/**
          if-no-files-found: error
          retention-days: 14
